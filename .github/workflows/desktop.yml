name: Build desktop bundles

on:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: ubuntu-26.04
            target: ubuntu-26.04-x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare the Linux build environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libxcb-cursor0 libegl1 libxkbcommon-x11-0
          python3 -m venv "$RUNNER_TEMP/video2txt-build"
          echo "$RUNNER_TEMP/video2txt-build/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-desktop.txt
      - run: python scripts/build_desktop.py
      - name: Generate a local audio fixture
        run: python -c "import wave; w=wave.open('smoke.wav','wb'); w.setparams((1,2,16000,0,'NONE','not compressed')); w.writeframes(bytes(32000)); w.close()"
      - name: Test and archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HF_HUB_OFFLINE = '1'
          $process = Start-Process -Wait -PassThru -FilePath ./dist/Video2Txt/Video2Txt.exe -ArgumentList '--smoke-test', 'smoke.wav'
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          Push-Location dist
          python -m zipfile -c ../Video2Txt-windows-x64.zip Video2Txt
          Pop-Location
      - name: Test and archive Linux bundle
        if: runner.os == 'Linux'
        run: |
          HF_HUB_OFFLINE=1 ./dist/Video2Txt/Video2Txt --smoke-test smoke.wav
          tar -C dist -czf Video2Txt-ubuntu-26.04-x64.tar.gz Video2Txt
      - uses: actions/upload-artifact@v4
        with:
          name: Video2Txt-${{ matrix.target }}
          path: |
            Video2Txt-*.zip
            Video2Txt-*.tar.gz
          compression-level: 0
          if-no-files-found: error
